name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, gd
          coverage: none

      - name: Lint
        run: find src views public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: End-to-end tests (mock B2)
        run: php tests/e2e/run.php
